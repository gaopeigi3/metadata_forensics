[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-forensics"
version = "0.1.0"
description = "Reproducible B01-B05 temporal entity alignment experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
metadata-forensics = "metadata_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
